[metadata]
name = cert_utils
version = attr: cert_utils.__VERSION__
description = TLS/SSL Certificate Utilities
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/aptise/cert_utils
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
license = MIT
keywords = web
classifiers =
    Intended Audience :: Developers
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
packages = find:
package_dir =
    = src
include_package_data = True
zip_safe = False
python_requires = >=3.7
install_requires =
    python-dateutil
    psutil>=4.4.0
    requests
    typing_extensions
    importlib_metadata; python_version < "3.8"

[options.packages.find]
where = src

[options.package_data]
cert_utils = py.typed

[options.extras_require]
testing =
    certbot
    cryptography>=42.0.0
    josepy<3
    mypy
    pytest
    pytest-cov
    pyOpenSSL
    coverage[toml]
    types-psutil
    types-python-dateutil
    types-requests
josepy =
    josepy<3

[options.entry_points]
console_scripts =
    cert_info = cert_utils.scripts.cert_info:main

[easy_install]
zip_ok = false

[flake8]
# Match Black's configured default line length.
max-line-length = 88
exclude = .eggs/*, .pytest_cache/*, .tox/*, build/*, dist/*

application_import_names = cert_utils
import_order_style = appnexus

# E501: line too long
# E203 whitespace before ':' - black makes it, flake8 hates it.
# F841 - assigned but never used
per-file-ignores =
    src/cert_utils/core.py: E501
    src/cert_utils/compat/cryptography.py: E501
    src/cert_utils/compat/openssl.py: E501
    src/cert_utils/compat/pyopenssl.py: E501
    src/cert_utils/conditionals.py: E501
    src/cert_utils/convert.py: E501
    src/cert_utils/letsencrypt_info/certificates.py: E501
    src/cert_utils/letsencrypt_info/rate_limits.py: E501
    src/cert_utils/model.py: E501
    src/cert_utils/scripts/cert_info.py: E501
    src/cert_utils/utils.py: E203, E501
    tests/_utils.py: E501    
    tests/test_data/draft-acme-ari/edge_case_generate.py: E501
    tests/test_data/long_chains/TestA/_demo.py: E501
    tests/test_unit.py: E501, F841
    tests/test_data/unit_tests/cert_001/test.py: E501
    